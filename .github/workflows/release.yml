name: Release

# Tag-driven: pushing an approved v* tag builds, verifies and publishes that version.
# Re-running is idempotent: a release that already exists is never overwritten.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v1.0.4)"
        required: true
        type: string
      publish:
        description: "Publish the GitHub Release (false = build and verify only)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

concurrency:
  group: release-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  determine-version:
    name: Verify Tag Matches Committed Version
    runs-on: ubuntu-22.04
    outputs:
      should_release: ${{ steps.versioning.outputs.should_release }}
      version: ${{ steps.versioning.outputs.version }}
      tag: ${{ steps.versioning.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12
          run_install: false

      - name: Verify tag matches the committed version
        id: versioning
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "Tag: $TAG | package.json: $PKG_VERSION"

          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "::error::Tag '$TAG' is not a v-prefixed version"; exit 1
          fi
          if [[ "$VERSION" != "$PKG_VERSION" ]]; then
            echo "::error::Tag $TAG does not match package.json version $PKG_VERSION"; exit 1
          fi

          HIGHEST="$(git tag -l 'v*' | sed 's/^v//' | sort -V | tail -1)"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            # Re-running an existing tag is allowed, but it must still be the newest.
            if [[ "$HIGHEST" != "$VERSION" ]]; then
              echo "::error::$TAG is not the highest version (highest is v$HIGHEST)"; exit 1
            fi
          elif [[ -n "$HIGHEST" ]] && [[ "$(printf '%s\n%s\n' "$HIGHEST" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]]; then
            echo "::error::$TAG is not newer than the highest release v$HIGHEST"; exit 1
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build-linux:
    name: Build Linux Packages
    needs: [determine-version]
    if: needs.determine-version.outputs.should_release == 'true'
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12
          run_install: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libnotify-bin libnotify-dev xvfb

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Gate A — Static TypeScript check
        run: pnpm typecheck

      - name: Gate A — ESLint analysis
        run: pnpm lint

      - name: Gate A — Vitest unit test suite
        run: pnpm test

      - name: Gate B — Zero-Mock Production Data Integrity Check
        run: node scripts/verify-zero-mock.mjs

      - name: Build application bundle
        run: pnpm build

      - name: Package Linux distributions (AppImage, deb, rpm)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec electron-builder --linux -p never

      - name: Generate Linux SHA-256 checksums
        shell: bash
        run: |
          cd release
          sha256sum Zenkai-Desktop-* > checksums-linux.txt
          cat checksums-linux.txt

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            release/Zenkai-Desktop-*.AppImage
            release/Zenkai-Desktop-*.deb
            release/Zenkai-Desktop-*.rpm
            release/latest-linux*.yml
            release/checksums-linux.txt
          retention-days: 14

  build-windows:
    name: Build Windows Packages
    needs: [determine-version]
    if: needs.determine-version.outputs.should_release == 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12
          run_install: false

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Gate A — Static TypeScript check
        run: pnpm typecheck

      - name: Gate A — ESLint analysis
        run: pnpm lint

      - name: Gate A — Vitest unit test suite
        run: pnpm test

      - name: Gate B — Zero-Mock Production Data Integrity Check
        run: node scripts/verify-zero-mock.mjs

      - name: Build application bundle
        run: pnpm build

      - name: Package Windows distributions (NSIS Setup & Portable Zip)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: pnpm exec electron-builder --win -p never

      - name: Generate Windows SHA-256 checksums
        shell: pwsh
        run: |
          cd release
          Get-FileHash -Algorithm SHA256 (Get-Item Zenkai-Desktop-*) | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } | Out-File -Encoding utf8 checksums-windows.txt
          Get-Content checksums-windows.txt

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            release/Zenkai-Desktop-*.exe
            release/Zenkai-Desktop-*.zip
            release/latest*.yml
            release/*.blockmap
            release/checksums-windows.txt
          retention-days: 14

  verify-artifacts:
    name: Independent Artifact Verification & Smoke Testing
    needs: [determine-version, build-linux, build-windows]
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Consolidate packages, metadata, and checksums
        shell: bash
        run: |
          mkdir -p dist
          # Copy all binaries, update metadata YAMLs, and blockmaps
          find downloaded-artifacts -type f \( -name "Zenkai-Desktop-*" -o -name "latest*.yml" -o -name "*.blockmap" \) ! -name "*.txt" -exec cp {} dist/ \;
          # Generate consolidated, authoritative SHA256SUMS.txt
          find downloaded-artifacts -type f -name "checksums-*.txt" -exec cat {} + | sort -u > dist/SHA256SUMS.txt

          echo "=== Staged Release Distribution Bundle ==="
          ls -lh dist/
          cat dist/SHA256SUMS.txt

      - name: Gate D & E — Execute Independent Verification & Container Smoke Test
        run: node scripts/verify-artifacts.mjs --dir dist

      - name: Upload verified release distribution bundle
        uses: actions/upload-artifact@v4
        with:
          name: verified-dist-bundle
          path: dist/*
          retention-days: 14

  publish-release:
    name: Publish Production GitHub Release
    needs: [determine-version, verify-artifacts]
    if: github.event_name == 'push' || inputs.publish == 'true'
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download verified release bundle
        uses: actions/download-artifact@v4
        with:
          name: verified-dist-bundle
          path: dist

      - name: Extract release notes from CHANGELOG
        shell: bash
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          node -e '
          const fs = require("fs");
          const v = process.env.VERSION;
          const md = fs.readFileSync("CHANGELOG.md", "utf8");
          const start = md.search(new RegExp("^## \\[" + v.replace(/\./g, "\\.") + "\\]", "m"));
          if (start === -1) { console.error("No CHANGELOG entry for " + v); process.exit(1); }
          const rest = md.slice(start);
          const next = rest.slice(1).search(/^## \[/m);
          const section = (next === -1 ? rest : rest.slice(0, next + 1)).trim();
          fs.writeFileSync("release-notes.md", section + "\n");
          console.log(section);
          '

      - name: Refuse to overwrite an existing release
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.determine-version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — leaving it untouched." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pre-publish validation — Ensure all critical platform assets exist
        if: steps.guard.outputs.already_published != 'true'
        shell: bash
        run: |
          echo "Validating release assets before publication..."
          ls -lh dist/

          # 1. Require Linux AppImage
          if ! ls dist/Zenkai-Desktop-*.AppImage 1> /dev/null 2>&1; then
            echo "::error::Linux AppImage is missing! Publication aborted."
            exit 1
          fi

          # 2. Require Windows NSIS Setup
          if ! ls dist/Zenkai-Desktop-*.exe 1> /dev/null 2>&1; then
            echo "::error::Windows NSIS installer is missing! Publication aborted."
            exit 1
          fi

          # 3. Require SHA256SUMS.txt
          if [ ! -s "dist/SHA256SUMS.txt" ]; then
            echo "::error::Authoritative SHA256SUMS.txt is missing or empty! Publication aborted."
            exit 1
          fi

          # 4. Require non-empty files
          for f in dist/*; do
            if [ ! -s "$f" ]; then
              echo "::error::Release file $f is empty or corrupt!"
              exit 1
            fi
          done
          echo "All release assets validated."

      - name: Publish Release to GitHub
        if: steps.guard.outputs.already_published != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.determine-version.outputs.tag }}
          name: "Zenkai Desktop ${{ needs.determine-version.outputs.tag }}"
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(needs.determine-version.outputs.tag, '-beta') || contains(needs.determine-version.outputs.tag, '-alpha') || contains(needs.determine-version.outputs.tag, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post-publish verification — Verify public accessibility of release assets
        if: steps.guard.outputs.already_published != 'true'
        shell: bash
        env:
          TAG: ${{ needs.determine-version.outputs.tag }}
        run: |
          echo "Verifying public asset availability for release $TAG..."
          sleep 5
          RELEASE_BASE_URL="https://github.com/johan-droid/Zenkai-Desktop-/releases/download/${TAG}"

          HTTP_LINUX=$(curl -s -o /dev/null -w "%{http_code}" -L "${RELEASE_BASE_URL}/latest-linux.yml")
          echo "latest-linux.yml HTTP status: $HTTP_LINUX"

          HTTP_WIN=$(curl -s -o /dev/null -w "%{http_code}" -L "${RELEASE_BASE_URL}/latest.yml")
          echo "latest.yml HTTP status: $HTTP_WIN"

          HTTP_SHA=$(curl -s -o /dev/null -w "%{http_code}" -L "${RELEASE_BASE_URL}/SHA256SUMS.txt")
          echo "SHA256SUMS.txt HTTP status: $HTTP_SHA"

      - name: Trigger Release Webhook (Optional automation)
        if: steps.guard.outputs.already_published != 'true'
        shell: bash
        env:
          WEBHOOK_URL: ${{ secrets.RELEASE_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.RELEASE_WEBHOOK_SECRET }}
          TAG: ${{ needs.determine-version.outputs.tag }}
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          if [ -n "$WEBHOOK_URL" ] && [ -n "$WEBHOOK_SECRET" ]; then
            echo "Triggering release webhook at $WEBHOOK_URL..."
            PAYLOAD=$(cat <<EOF
          {
            "action": "published",
            "repository": {
              "full_name": "${{ github.repository }}"
            },
            "release": {
              "tag_name": "$TAG",
              "target_commitish": "${{ github.sha }}",
              "name": "Zenkai Desktop $TAG",
              "draft": false,
              "prerelease": ${{ contains(needs.determine-version.outputs.tag, '-beta') }},
              "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            }
          }
          EOF
            )
            SIGNATURE="sha256=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | awk '{print $2}')"
            curl -s -X POST "$WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -H "X-Hub-Signature-256: $SIGNATURE" \
              -H "X-GitHub-Event: release" \
              -d "$PAYLOAD" || echo "Webhook trigger non-fatal warning"
          else
            echo "RELEASE_WEBHOOK_URL not configured — skipping external webhook notification."
          fi

      - name: Generate Release Report Summary
        shell: bash
        env:
          TAG: ${{ needs.determine-version.outputs.tag }}
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## 🚀 Zenkai Desktop Production Release Published: \`$TAG\`

          - **Application Version:** \`$VERSION\`
          - **Git Tag:** \`$TAG\`
          - **Release URL:** [https://github.com/johan-droid/Zenkai-Desktop-/releases/tag/$TAG](https://github.com/johan-droid/Zenkai-Desktop-/releases/tag/$TAG)
          - **Linux Distribution:** AppImage (x86_64), Debian (.deb), RPM (.rpm)
          - **Windows Distribution:** NSIS Setup (.exe), Portable (.zip)
          - **OTA Update Metadata:** \`latest-linux.yml\`, \`latest.yml\` (SHA-512 cryptographically signed)
          - **Cryptographic Manifest:** \`SHA256SUMS.txt\`
          EOF
