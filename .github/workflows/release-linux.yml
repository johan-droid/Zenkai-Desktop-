name: Release — Linux Package Builder

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Application version to package (e.g. 0.0.3)"
        required: false
        default: "0.0.1"
        type: string

permissions:
  contents: read

jobs:
  build-linux:
    name: Package Linux Distributions (AppImage, deb, rpm)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12
          run_install: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libnotify-bin libnotify-dev xvfb

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Gate B — Zero-Mock Production Data Integrity Check
        run: node scripts/verify-zero-mock.mjs

      - name: Synchronize package version
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          if [ -n "$VERSION" ] && [ "$VERSION" != "null" ]; then
            npm version "$VERSION" --no-git-tag-version --allow-same-version
          fi
          echo "Building Linux package for version $(node -p "require('./package.json').version")"

      - name: Build application bundle
        run: pnpm build

      - name: Package Linux distributions (AppImage, deb, rpm)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec electron-builder --linux -p never

      - name: Generate Linux SHA-256 checksums
        shell: bash
        run: |
          cd release
          sha256sum Zenkai-Desktop-* > checksums-linux.txt
          cat checksums-linux.txt

      - name: Upload Linux build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            release/Zenkai-Desktop-*.AppImage
            release/Zenkai-Desktop-*.deb
            release/Zenkai-Desktop-*.rpm
            release/latest-linux*.yml
            release/checksums-linux.txt
          retention-days: 14
