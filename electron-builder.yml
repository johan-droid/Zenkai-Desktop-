appId: app.zenkai.desktop
productName: Zenkai
directories:
  output: release
  buildResources: resources
extraResources:
  - from: resources/tray.png
    to: tray.png
files:
  - out/**
  - package.json
asar: true
publish:
  provider: github
  owner: johan-droid
  repo: Zenkai-Desktop-
  releaseType: release
afterSign: scripts/after-sign.mjs

win:
  icon: resources/icon.ico
  target:
    - { target: nsis, arch: [x64, arm64] }
    - { target: portable, arch: [x64] }
  # §9 wrote signingHashAlgorithms at win level; electron-builder 26 schema
  # (additionalProperties: false) nests it under signtoolOptions — same value.
  signtoolOptions:
    signingHashAlgorithms: [sha256]

mac:
  category: public.app-category.entertainment
  icon: resources/icon.icns
  hardenedRuntime: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  target:
    - { target: dmg, arch: [universal] }
    - { target: zip, arch: [universal] }

linux:
  icon: resources/icon.png
  category: AudioVideo
  maintainer: dev@zenkai.cfd
  syncDesktopName: true # .desktop filename matches StartupWMClass/app_id (desktopName)
  target:
    - { target: AppImage, arch: [x64, arm64] }
    - { target: deb, arch: [x64, arm64] }
    - { target: rpm, arch: [x64, arm64] }
